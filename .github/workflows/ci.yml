name: NEXUS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python / API ──────────────────────────────────────────────────────
  api-test:
    name: API Tests (Python 3.12)
    runs-on: ubuntu-latest

    env:
      LLM_PROVIDER: mock
      NEXUS_ENV: development
      NEXUS_LICENSE_KEY: trial
      QDRANT_URL: http://localhost:6333
      NEO4J_URI: bolt://localhost:7687

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Run unit + integration tests
        working-directory: api
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-omit="tests/*,*/migrations/*" \
            -m "not requires_services"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: api/coverage.xml
          flags: api
          fail_ci_if_error: false

  # ── Type checking ──────────────────────────────────────────────────────
  api-typecheck:
    name: Type Check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyright pydantic pydantic-settings fastapi
      - name: Pyright
        working-directory: api
        run: pyright --pythonversion 3.12 . || true   # warn, don't fail on first pass

  # ── Frontend ──────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline 2>/dev/null || npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Docker smoke test ─────────────────────────────────────────────────
  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [api-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build --quiet

      - name: Start stack (no seeder)
        run: |
          docker compose up -d qdrant neo4j api
          sleep 30

      - name: Wait for API health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              echo "API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy"
          docker compose logs api
          exit 1

      - name: Verify API root
        run: |
          curl -sf http://localhost:8000/ | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['platform'] == 'NEXUS', f'unexpected: {d}'
          print('Root endpoint OK:', d)
          "

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ── Security scan ─────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory only — don't block deploys on first run

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - name: Audit dependencies
        working-directory: api
        run: pip-audit -r requirements.txt --output=json --desc || true

  # ── Release gate ──────────────────────────────────────────────────────
  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [api-test, frontend-build]
    steps:
      - run: echo "All required checks passed ✓"
