name: nexus-prod

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nexus-qdrant-prod
    volumes:
      - qdrant_data:/qdrant/storage:rw
    expose:
      - "6333"
      - "6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  neo4j:
    image: neo4j:5.24-community
    container_name: nexus-neo4j-prod
    expose:
      - "7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data:rw
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.0'

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nexus-api-prod
    expose:
      - "8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      NEXUS_LICENSE_KEY: ${NEXUS_LICENSE_KEY}
      NEXUS_ADMIN_SECRET: ${NEXUS_ADMIN_SECRET}
      NEXUS_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_USER_ID: ${DEMO_USER_ID:-demo-user-nexus}
      LOG_LEVEL: INFO
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend-prod
    expose:
      - "80"
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    restart: always

  seeder:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nexus-seeder-prod
    command: python -m catalog.seed
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      LLM_PROVIDER: mock
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  default:
    name: nexus-prod-net
