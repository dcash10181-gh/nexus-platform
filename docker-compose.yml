# NEXUS Platform — AI-Native Video Orchestration
# Single-command deployment: `curl -sSL https://get.nexus.ai | bash`
# Or locally: `docker compose up -d`

services:
  # Vector database — semantic content embeddings + user preference vectors
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nexus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Knowledge graph — content entity relationships, themes, narrative DNA
  neo4j:
    image: neo4j:5.24-community
    container_name: nexus-neo4j
    ports:
      - "7474:7474"  # browser
      - "7687:7687"  # bolt
    environment:
      NEO4J_AUTH: neo4j/nexus-dev-password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Recommendation API — FastAPI, MCP orchestrator, agentic loop
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nexus-api
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: nexus-dev-password
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXUS_LICENSE_KEY: ${NEXUS_LICENSE_KEY:-trial}
      NEXUS_ENV: ${NEXUS_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Streaming proxy — HLS passthrough + adaptive bitrate
  streaming:
    build:
      context: ./streaming
      dockerfile: Dockerfile
    container_name: nexus-streaming
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  # Frontend — React + Vite + Tailwind, the user-facing experience
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # One-shot seeder — populates Qdrant + Neo4j with curated catalog
  seeder:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nexus-seeder
    command: python -m catalog.seed
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: nexus-dev-password
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: "no"

volumes:
  qdrant_data:
  neo4j_data:

networks:
  default:
    name: nexus-net
