name: nexus-platform

services:

  # ── Vector database ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nexus-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Knowledge graph ──────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.24-community
    container_name: nexus-neo4j
    expose:
      - "7687"
    ports:
      - "7474:7474"   # Browser UI — open http://localhost:7474
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nexus-dev-password}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache__size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  # ── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nexus-api
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL:          http://qdrant:6333
      NEO4J_URI:           bolt://neo4j:7687
      NEO4J_USER:          neo4j
      NEO4J_PASSWORD:      ${NEO4J_PASSWORD:-nexus-dev-password}
      LLM_PROVIDER:        ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY:   ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:      ${OPENAI_API_KEY:-}
      NEXUS_LICENSE_KEY:   ${NEXUS_LICENSE_KEY:-trial}
      NEXUS_ADMIN_SECRET:  ${NEXUS_ADMIN_SECRET:-nexus-admin-dev}
      NEXUS_ENV:           ${NEXUS_ENV:-development}
      DEMO_MODE:           ${DEMO_MODE:-true}
      TMDB_API_KEY:        ${TMDB_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── One-shot catalog seeder ──────────────────────────────────────────────
  seeder:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nexus-seeder
    command: python -m catalog.seed
    environment:
      QDRANT_URL:   http://qdrant:6333
      NEO4J_URI:    bolt://neo4j:7687
      NEO4J_USER:   neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus-dev-password}
      LLM_PROVIDER: mock
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  qdrant_data:
  neo4j_data:
