# fly.toml — NEXUS API deployment on Fly.io
# Uses managed Qdrant Cloud + Neo4j AuraDB (both free tier)
# Frontend deployed separately on Vercel
#
# First deploy:
#   fly launch --config fly.toml --no-deploy
#   fly secrets set ANTHROPIC_API_KEY=... (see deployment guide)
#   fly deploy

app            = "nexus-platform-api"
primary_region = "iad"

[build]
  dockerfile    = "api/Dockerfile"
  build_target  = ""

[env]
  LLM_PROVIDER      = "anthropic"
  NEXUS_ENV         = "production"
  NEXUS_LICENSE_KEY = "trial"
  DEMO_MODE         = "true"
  DEMO_USER_ID      = "demo-user-nexus"
  LOG_LEVEL         = "INFO"

# All secrets set via: fly secrets set KEY=value
# Required:
#   ANTHROPIC_API_KEY      — LLM provider
#   QDRANT_URL             — Qdrant Cloud cluster URL
#   QDRANT_API_KEY         — Qdrant Cloud API key
#   NEO4J_URI              — AuraDB connection URI (neo4j+s://...)
#   NEO4J_PASSWORD         — AuraDB password
#   NEXUS_ADMIN_SECRET     — Admin panel password
#   TMDB_API_KEY           — Optional, enables real posters

[[services]]
  protocol      = "tcp"
  internal_port = 8000

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval     = "30s"
    timeout      = "10s"
    grace_period = "60s"
    method       = "GET"
    path         = "/health"

[[vm]]
  cpu_kind   = "shared"
  cpus       = 2
  memory_mb  = 2048
