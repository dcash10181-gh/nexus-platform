# fly.toml — NEXUS Platform deployment on Fly.io
# Deploy: fly launch --config fly.toml
# Docs: https://fly.io/docs/reference/configuration/

app = "nexus-platform"
primary_region = "iad"

[build]
  dockerfile = "api/Dockerfile"

[env]
  LLM_PROVIDER       = "anthropic"
  NEXUS_ENV          = "production"
  NEXUS_LICENSE_KEY  = "trial"
  DEMO_MODE          = "true"
  DEMO_USER_ID       = "demo-user-nexus"
  LOG_LEVEL          = "INFO"

# Secrets (set with `fly secrets set KEY=value`):
#   ANTHROPIC_API_KEY
#   NEXUS_ADMIN_SECRET
#   TMDB_API_KEY
#   NEO4J_PASSWORD
#   NEXUS_LICENSE_KEY  (commercial key for production)

[[services]]
  protocol    = "tcp"
  internal_port = 8000

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 400

  [[services.tcp_checks]]
    interval    = "15s"
    timeout     = "10s"
    grace_period = "30s"

  [[services.http_checks]]
    interval    = "15s"
    timeout     = "5s"
    grace_period = "30s"
    method      = "GET"
    path        = "/health"
    protocol    = "http"

[mounts]
  source      = "nexus_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus     = 2
  memory_mb = 2048
